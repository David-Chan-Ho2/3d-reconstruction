[project]
name = "3d-reconstruction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.30.0",
    "pillow>=12.3.0",
    "rembg>=2.0.84",
]

[project.scripts]
create_masks = "scripts.create_masks:main"
resize = "scripts.resize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]